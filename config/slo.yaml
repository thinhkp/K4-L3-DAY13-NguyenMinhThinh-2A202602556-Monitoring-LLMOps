service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Tỷ lệ request tốt = response_sent có latency_ms <= 3000 ghép với request_received theo correlation_id / tổng request_received. SLO 99.5% trong 28 ngày cho phép 0.5% request không đạt; với 10,000 request, error budget là tối đa 50 request lỗi hoặc chậm.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
