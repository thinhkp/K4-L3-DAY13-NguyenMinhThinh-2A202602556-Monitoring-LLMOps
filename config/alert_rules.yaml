alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: NguyenMinhThinh-2A202602556
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrorRate
    severity: critical
    condition: request_failed / request_received > 2%
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: NguyenMinhThinh-2A202602556
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: tool_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: NguyenMinhThinh-2A202602556
    runbook: docs/alerts.md#alert-3
